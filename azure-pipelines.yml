trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:

- stage: Build
  displayName: 'Build Application'

  jobs:

  - job: BuildApplication
    displayName: 'Build Flask Application'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'

    - script: |
        python --version
        pip --version
      displayName: 'Check Python Version'

    - script: |
        pip install -r requirements.txt
      displayName: 'Install Dependencies'

    - script: |
        python -m py_compile app.py
      displayName: 'Validate Application'

    - script: |
        python -m pytest
      displayName: 'Run Automated Tests'

    - script: |
        docker build -t azure-pipeline-demo:$(Build.BuildId) .
      displayName: 'Build Docker Image'

    - script: |
        docker save azure-pipeline-demo:$(Build.BuildId) \
        -o $(Build.ArtifactStagingDirectory)/azure-pipeline-demo.tar
      displayName: 'Save Docker Image'

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/azure-pipeline-demo.tar'
        artifact: 'docker-image'
      displayName: 'Publish Docker Image Artifact'